apiVersion: v1
kind: Namespace
metadata:
  name: plain
---
# Endpoints that answer with their own pod name, so a request through the VIP
# says which endpoint served it.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ep
  namespace: plain
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ep
  template:
    metadata:
      labels:
        app: ep
    spec:
      containers:
        - name: server
          image: ghcr.io/loxilb-io/nettest:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          command:
            - /bin/bash
            - -c
            - |
              printf 'HTTP/1.1 200 OK\r\nContent-Type: text/plain\r\nContent-Length: %d\r\nConnection: close\r\n\r\n%s' \
                "${#POD_NAME}" "$POD_NAME" > /tmp/resp
              exec socat -T5 tcp-l:8080,fork,reuseaddr system:'cat /tmp/resp'
          ports:
            - containerPort: 8080
