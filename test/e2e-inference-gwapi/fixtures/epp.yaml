# Stand-in Endpoint Picker: cmd/epp-fake from loxilb-inference-gateway, an
# ext_proc server that names one fixed model server for every request and plays
# the response phase like the llm-d EPP. It serves a self-signed certificate,
# as the llm-d EPP does, so the gateway's default (TLS without verification)
# is the path under test.
#
# A template: config.sh fills in __EPP_IMAGE__ and __EPP_DEST__ (the model
# server the picker names) and applies the result.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: epp
  namespace: llm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: epp
  template:
    metadata:
      labels:
        app: epp
    spec:
      containers:
        - name: epp
          image: __EPP_IMAGE__
          imagePullPolicy: Never
          args: ["-listen", "0.0.0.0:9002", "-tls", "-dest", "__EPP_DEST__"]
          ports:
            - containerPort: 9002
          # Ready only once it listens, so the Service has no endpoint while
          # the picker is down - which is what the failure checks rely on.
          readinessProbe:
            tcpSocket:
              port: 9002
            periodSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: epp
  namespace: llm
spec:
  selector:
    app: epp
  ports:
    - name: grpc-ext-proc
      port: 9002
      targetPort: 9002
