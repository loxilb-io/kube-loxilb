# A second pool on the same listener, declaring no credential policy.
apiVersion: inference.networking.k8s.io/v1
kind: InferencePool
metadata:
  name: vllm-open
  namespace: llm
  annotations:
    loxilb.io/epselect: "chwbl"
    loxilb.io/model-name: "qwen3-open"
spec:
  selector:
    matchLabels:
      app: vllm-qwen3
  targetPorts:
    - number: 8000
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: open-route
  namespace: llm
spec:
  parentRefs:
    - name: inference-gw
  rules:
    - backendRefs:
        - group: inference.networking.k8s.io
          kind: InferencePool
          name: vllm-open
