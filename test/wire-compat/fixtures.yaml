apiVersion: v1
kind: Namespace
metadata:
  name: l1
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: ep, namespace: l1}
spec:
  replicas: 2
  selector: {matchLabels: {app: ep}}
  template:
    metadata: {labels: {app: ep}}
    spec:
      containers:
      - name: ep
        image: ghcr.io/loxilb-io/nettest:latest
        imagePullPolicy: IfNotPresent
        command: ["sleep", "infinity"]
        ports: [{containerPort: 80}]
---
apiVersion: v1
kind: Service
metadata:
  name: f1-plain
  namespace: l1
  annotations:
    fixture: "f1"
spec:
  type: LoadBalancer
  loadBalancerClass: loxilb.io/loxilb
  selector: {app: ep}
  ports:
  - port: 8001
    targetPort: 80
    protocol: TCP
    nodePort: 30001
