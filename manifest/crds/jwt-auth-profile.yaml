apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: jwtauthprofiles.jwtauthprofile.loxilb.io
spec:
  group: jwtauthprofile.loxilb.io
  names:
    kind: JWTAuthProfile
    listKind: JWTAuthProfileList
    plural: jwtauthprofiles
    singular: jwtauthprofile
  scope: Cluster
  versions:
    - name: v1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
      - name: Issuer
        type: string
        jsonPath: .spec.issuer
      - name: Programmed
        type: string
        jsonPath: .status.conditions[?(@.type=="Programmed")].status
      - name: Age
        type: date
        jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          description: >-
            A JWT auth profile that kube-loxilb registers on every loxilb-inference-gateway
            instance enforcing them. The name is the profile's name, the value of the
            loxilb.io/jwt-auth-profile annotation of the Services and InferencePools that use it.
          type: object
          required:
            - spec
          x-kubernetes-validations:
            - rule: size(self.metadata.name) <= 63
              message: the name is the gateway's profile name, at most 63 characters
          properties:
            spec:
              type: object
              required:
                - issuer
              properties:
                issuer:
                  description: The exact iss a token must carry; also the base of OIDC discovery unless jwksUrl is set.
                  type: string
                  pattern: '^https?://'
                jwksUrl:
                  description: Where the signing keys are, instead of discovering them from the issuer.
                  type: string
                audiences:
                  description: Accepted aud and azp values; one has to match. Empty skips the audience check.
                  type: array
                  items:
                    type: string
                algs:
                  description: Accepted signature algorithms. Gateway default RS256, ES256.
                  type: array
                  items:
                    type: string
                leewaySec:
                  description: Clock skew allowed on exp, nbf and iat. Gateway default 30.
                  type: integer
                  minimum: 0
                refreshSec:
                  description: How often the signing keys are fetched again. Gateway default 3600.
                  type: integer
                  minimum: 0
                tenantClaim:
                  description: Claim with the tenant. Gateway default tenant_id.
                  type: string
                defaultTenant:
                  description: Tenant of a token without one; empty refuses such a token.
                  type: string
                userClaim:
                  description: Claim with the user. Gateway default sub.
                  type: string
                usernameClaim:
                  description: Claim with the user's name. Gateway default preferred_username.
                  type: string
                modelsClaim:
                  description: Claim listing the models the token may use; unset derives them from roles.
                  type: string
                rolesClaim:
                  description: Claim with the roles. Gateway default realm_access.roles.
                  type: string
                modelRolePrefix:
                  description: Prefix of the roles that name a model. Gateway default model:.
                  type: string
                modelAuthz:
                  description: What a token without a model list gets.
                  type: string
                  enum: ["", claims-required, allow-all]
                forwardIdentity:
                  description: Pass the verified identity upstream in X-Auth-* headers.
                  type: boolean
                authorizationPassthrough:
                  description: Leave the client's Authorization header on the upstream request.
                  type: boolean
                priorityClass:
                  type: string
                  enum: ["", standard, critical, sheddable]
            status:
              type: object
              properties:
                conditions:
                  type: array
                  items:
                    type: object
                    required: [type, status, lastTransitionTime, reason, message]
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      observedGeneration:
                        type: integer
                      lastTransitionTime:
                        type: string
                        format: date-time
                      reason:
                        type: string
                      message:
                        type: string
                peers:
                  type: array
                  items:
                    type: object
                    required: [host, programmed]
                    properties:
                      host:
                        type: string
                      programmed:
                        type: boolean
                      lastError:
                        type: string
